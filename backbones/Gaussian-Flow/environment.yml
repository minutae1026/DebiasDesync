# Conda environment for the Gaussian-Flow backbone (Python 3.9, torch 1.13.1 + CUDA 11.7, Taichi 1.7.4).
#   conda env create -f backbones/Gaussian-Flow/environment.yml
#   conda activate debiasdesync-gaussian-flow
#   bash backbones/Gaussian-Flow/setup_env.sh   # builds the stock rasterizer and simple-knn
name: debiasdesync-gaussian-flow
channels:
  - nvidia/label/cuda-11.7.1
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - cuda-nvcc=11.7.99
  - cuda-cudart-dev=11.7.99
  - cuda-nvrtc-dev=11.7.99
  - gcc_linux-64=11.4
  - gxx_linux-64=11.4
  - libxcrypt
  - libgl-devel
  - ninja
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu117
      - --find-links https://dl.fbaipublicfiles.com/pytorch3d/packaging/wheels/py39_cu117_pyt1131/download.html
      - torch==1.13.1+cu117
      - torchvision==0.14.1+cu117
      - pytorch3d==0.7.3
      - fvcore==0.1.5.post20221221
      - iopath==0.1.10
      - taichi==1.7.4
      - mmcv==1.6.0
      - numpy==1.23.5
      - opencv-python-headless==4.8.1.78
      - imageio==2.37.2
      - imageio-ffmpeg==0.6.0
      - lpips==0.1.4
      - pytorch-msssim==1.0.0
      - plyfile==1.1.3
      - tqdm==4.70.0
      - termcolor==3.1.0
      - matplotlib==3.9.4
      - scipy==1.13.1
      - yacs==0.1.8
